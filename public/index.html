<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>⚾ Scorecard</title>
<style>
  :root {
    --bg: #f4f5f7;
    --activity: #4c6ef5;
    --step: #74c0fc;
    --card: #fff9c4;
    --card-done: #d3f9d8;
    --lane-label: #868e96;
    --border: #dee2e6;
    --spot-todo: #212529;
    --spot-done: #e03131;
    --step-band-light: #e2f1fc;
    --step-band-dark: #c9e3f7;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, "Noto Sans TC", sans-serif; background: var(--bg); color: #212529; }

  header {
    position: sticky; top: 0; z-index: 20;
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
    padding: 12px 20px; background: #fff; border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 18px; }
  header .file { font-size: 12px; color: var(--lane-label); font-family: ui-monospace, monospace; }
  header .legend { margin-left: auto; font-size: 12px; color: var(--lane-label); display: flex; gap: 14px; }
  header .legend span::before { content: "■ "; }
  header .legend .l-todo::before  { color: #ffe066; }
  header .legend .l-done::before  { color: #69db7c; }
  header .legend .l-miss::before  { color: #ced4da; }
  header .legend .l-drag::before  { content: "⠿ "; color: #adb5bd; }
  .view-toggle {
    display: inline-flex; align-items: center; gap: 10px; padding: 5px 9px;
    background: #fff; border: 1px solid var(--border); border-radius: 5px;
    color: #495057; font: inherit; font-size: 12px; cursor: pointer;
  }
  .view-toggle:hover { background: #f1f3f5; }
  .view-toggle kbd { color: var(--lane-label); font: 11px ui-monospace, monospace; }
  body[data-view="spots-route"] .legend .l-todo::before { content: "● "; color: var(--spot-todo); }
  body[data-view="spots-route"] .legend .l-done::before { content: "● "; color: var(--spot-done); }
  body[data-view="spots-route"] .legend .l-miss { display: none; }
  body[data-view="spots-route"] .legend .l-drag::before { content: ""; }

  #board { overflow-x: auto; padding: 20px; }
  .grid { display: grid; gap: 8px; align-items: stretch; min-width: max-content; }

  .activity, .step {
    border-radius: 6px; padding: 8px 10px; font-weight: 600; text-align: center;
    color: #fff; font-size: 14px;
  }
  .activity { background: var(--activity); }
  .step { background: var(--step); color: #1c3d5a; font-weight: 500; font-size: 13px; }

  /* The release name sits at the bottom of its lane, labelling the line below it. */
  .lane-label {
    display: flex; align-items: flex-end; justify-content: flex-end;
    font-size: 12px; color: var(--lane-label);
    font-weight: 600; padding: 0 8px 0 0; margin-bottom: -8px; text-align: right; max-width: 110px;
    word-break: break-word; position: sticky; left: 0; background: var(--bg); z-index: 5;
  }
  .lane-sep { grid-column: 1 / -1; border-top: 2px dashed #ced4da; margin: 4px 0; }

  .cell { display: flex; flex-direction: column; gap: 6px; min-width: 150px; min-height: 10px; }
  .card {
    background: var(--card); border: 1px solid #f1e05a; border-radius: 5px;
    padding: 7px 9px; font-size: 13px; line-height: 1.35; cursor: grab;
    box-shadow: 0 1px 2px rgba(0,0,0,.08); position: relative; max-width: 420px;
    user-select: none;
  }
  .card:active { cursor: grabbing; }

  /* While a card is in flight every cell must be a comfortable drop target,
     including the empty ones that are only a few pixels tall at rest. */
  body.dragging .cell { min-height: 34px; border-radius: 6px; }
  body.dragging .card { cursor: grabbing; }
  .card.dragging { opacity: .4; }
  .cell.drop { background: rgba(76,110,245,.08); outline: 2px dashed #91a7ff; outline-offset: 2px; }
  .drop-line { height: 3px; margin: -1.5px 0; border-radius: 2px; background: var(--activity); }
  /* 一行放不下就截斷成「…」；滑鼠停在卡片上用 tooltip 看全文 */
  .card .t {
    display: block; padding-right: 14px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card.done { background: var(--card-done); border-color: #8ce99a; }
  .card.done .t { text-decoration: line-through; color: #495057; }
  .card.linked { cursor: pointer; }
  .card.linked:hover { box-shadow: 0 2px 6px rgba(0,0,0,.18); }
  .card.missing { background: #f1f3f5; border-style: dashed; border-color: #adb5bd; color: #495057; }
  .card .mark { position: absolute; right: 6px; top: 4px; font-size: 11px; }
  .card .sources { display: block; margin-top: 4px; font-size: 10px; color: #687076; }

  .spots-route {
    display: grid; grid-template-columns: clamp(132px, 20vw, 224px) minmax(160px, 1fr);
    gap: 24px; width: max-content; min-width: max(316px, 100%);
  }
  .spots-area { min-width: 0; padding-right: 16px; border-right: 1px solid var(--border); }
  .route-area { min-width: 0; }
  .spots-route h2 { font-size: 14px; font-weight: 600; margin-bottom: 16px; }
  .spots-route h2 span { margin-left: 8px; color: var(--lane-label); font-size: 11px; font-weight: 400; }
  .route-map { position: relative; isolation: isolate; width: max-content; min-width: 100%; }
  .route-release { position: relative; z-index: 2; padding-bottom: 30px; }
  .route-release:last-child { padding-bottom: 0; }
  .route-release h3 { font-size: 12px; font-weight: 500; color: #687076; margin-bottom: 8px; padding-left: 24px; }
  .route-track { width: max-content; padding: 10px 24px; }
  .route-nodes {
    display: flex; gap: 0; width: max-content; height: 48px;
  }
  .route-step {
    display: grid; flex-shrink: 0; grid-auto-flow: column; grid-auto-columns: 104px;
    grid-template-rows: 48px; column-gap: 8px; width: max-content; min-width: 6px;
  }
  .route-bands, .route-arrows { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .route-bands { z-index: 0; }
  .route-arrows { z-index: 1; }
  .step-band { fill: var(--step-band-light); }
  .step-band.alt { fill: var(--step-band-dark); }
  .route-link { fill: none; stroke: #adb5bd; stroke-width: 1.25; }
  .feature-node {
    display: flex; flex-direction: column; align-items: center; min-width: 0;
    padding: 0 4px; border: 0; border-radius: 4px; background: transparent;
    color: inherit; font: inherit; font-size: 12px; cursor: pointer;
  }
  .feature-dot { display: block; flex-shrink: 0; width: 14px; height: 14px; border-radius: 50%; background: var(--spot-todo); }
  .feature-node.done .feature-dot { background: var(--spot-done); }
  .feature-node:hover .feature-dot { box-shadow: 0 0 0 5px rgba(33,37,41,.08); }
  .feature-node:focus-visible, .view-toggle:focus-visible { outline: 2px solid var(--activity); outline-offset: 3px; }
  .feature-label { display: block; width: 100%; min-width: 0; margin-top: 8px; line-height: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .spots-nodes { display: flex; flex-direction: column; gap: 2px; }
  .spots-nodes .feature-node { display: grid; grid-template-columns: 14px minmax(0, 1fr); align-items: center; gap: 10px; min-height: 32px; padding: 5px 0; text-align: left; }
  .spots-nodes .feature-label { margin-top: 0; }
  .spots-empty, .route-empty { color: var(--lane-label); font-size: 12px; padding: 10px 0; }

  #drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 92vw);
    background: #fff; border-left: 1px solid var(--border); box-shadow: -4px 0 16px rgba(0,0,0,.12);
    transform: translateX(102%); transition: transform .18s ease; z-index: 30;
    display: flex; flex-direction: column;
  }
  #drawer.open { transform: none; }
  #drawer .head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  #drawer .head b { font-size: 15px; }
  #drawer .head .path { font-size: 11px; color: var(--lane-label); font-family: ui-monospace, monospace; }
  #drawer .head button { margin-left: auto; border: none; background: none; font-size: 18px; cursor: pointer; color: #868e96; }
  #d-body { flex: 1; overflow: auto; padding: 0 16px 20px; }
  .preview-section { padding: 18px 0; border-bottom: 1px solid var(--border); scroll-margin-top: 12px; }
  .preview-section h2 { font-size: 14px; margin-bottom: 5px; }
  .source-path { display: block; overflow-wrap: anywhere; margin-bottom: 12px; color: #687076; font: 11px ui-monospace, monospace; }
  .preview-error, .preview-note { font-size: 12px; line-height: 1.6; color: #a15c00; margin: 8px 0; }
  .preview-empty { padding: 20px 0; color: #687076; }
  .markdown { font-size: 13px; line-height: 1.65; overflow-wrap: anywhere; }
  .markdown p, .markdown ul, .markdown ol, .markdown pre, .markdown blockquote, .markdown table { margin: 9px 0; }
  .markdown ul, .markdown ol { padding-left: 24px; }
  .markdown li > p { margin: 3px 0; }
  .markdown h1 { font-size: 20px; margin: 14px 0 8px; }
  .markdown h2 { font-size: 17px; margin: 14px 0 8px; }
  .markdown h3, .markdown h4, .markdown h5, .markdown h6 { font-size: 14px; margin: 12px 0 6px; }
  .markdown a { color: #4263eb; }
  .markdown input[type=checkbox] { margin-right: 6px; vertical-align: middle; }
  .markdown blockquote { border-left: 3px solid var(--border); padding-left: 12px; color: #687076; }
  .markdown table { border-collapse: collapse; display: block; overflow: auto; }
  .markdown th, .markdown td { border: 1px solid var(--border); padding: 5px 8px; }
  .markdown img { max-width: 100%; }
  .markdown :not(pre) > code { background: #f1f3f5; padding: 1px 4px; border-radius: 3px; }
  .markdown pre, .gherkin {
    overflow: auto; margin: 10px 0; padding: 12px; background: #f8f9fa; border-radius: 4px;
    font: 12.5px/1.55 ui-monospace, "SFMono-Regular", Consolas, monospace; white-space: pre-wrap;
  }
  .markdown pre code { font: inherit; }
  .gk-kw { color: #7048e8; font-weight: 700; }
  .gk-tag { color: #0b7285; }
  .gk-comment { color: #adb5bd; }
  .gk-table { color: #e8590c; }
  .gk-string { color: #2b8a3e; }

  #empty { padding: 60px 20px; text-align: center; color: var(--lane-label); font-size: 14px; }
  #warnings { padding: 4px 20px 16px; font-size: 12px; color: #e03131; }

  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
    background: #212529; color: #fff; font-size: 13px; padding: 9px 16px; border-radius: 6px;
    box-shadow: 0 4px 14px rgba(0,0,0,.25); opacity: 0; pointer-events: none;
    transition: opacity .15s ease, transform .15s ease; z-index: 40;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<header>
  <h1 id="title">⚾ Scorecard</h1>
  <span class="file" id="file"></span>
  <button id="view-toggle" class="view-toggle" type="button" aria-pressed="false" aria-keyshortcuts="Tab" title="切換 USM / spots-route（Tab）">
    <span id="view-label">USM</span><kbd>Tab</kbd>
  </button>
  <span class="legend">
    <span class="l-todo">待辦</span>
    <span class="l-done">完成</span>
    <span class="l-miss">尚無可預覽內容</span>
    <span class="l-drag" id="interaction-hint">拖曳換 release／step · 點兩下勾選完成</span>
  </span>
</header>
<div id="board"></div>
<div id="warnings"></div>
<div id="toast"></div>

<div id="drawer">
  <div class="head">
    <b id="d-title"></b><span class="path" id="d-path"></span>
    <button onclick="closeDrawer()" title="關閉">✕</button>
  </div>
  <div id="d-body"></div>
</div>

<script src="/vendor/markdown-it.js"></script>
<script>
let version = null;
let viewVersion = null;
let opened = null;
let previewRequest = 0;
let currentMap = null;
let activeView = 'usm';
let routeObserver = null;

function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function highlightGherkin(src) {
  const KW = /^(\s*)(Feature|Rule|Background|Scenario Outline|Scenario Template|Scenario|Example|Examples|Given|When|Then|And|But|功能|規則|背景|場景大綱|場景|例子|假設|假如|假定|當|那麼|而且|並且|但是)(:?)/;
  return src.split('\n').map(line => {
    if (/^\s*#/.test(line)) return '<span class="gk-comment">' + esc(line) + '</span>';
    if (/^\s*@/.test(line)) return '<span class="gk-tag">' + esc(line) + '</span>';
    if (/^\s*\|/.test(line)) return '<span class="gk-table">' + esc(line) + '</span>';
    const m = line.match(KW);
    if (m) {
      const rest = line.slice(m[0].length);
      return esc(m[1]) + '<span class="gk-kw">' + esc(m[2] + m[3]) + '</span>' +
        esc(rest).replace(/(&quot;.*?&quot;|&lt;.*?&gt;)/g, '<span class="gk-string">$1</span>');
    }
    return esc(line);
  }).join('\n');
}

function documentPath(href, basePath) {
  if (!href || /^(?:[a-z][a-z\d+.-]*:|\/|#)/i.test(href)) return null;
  let target;
  try { target = decodeURIComponent(href.split(/[?#]/)[0]); } catch { return null; }
  if (!/\.(md|feature)$/i.test(target) || /[\0\\]/.test(target)) return null;
  const parts = basePath.split('/').slice(0, -1);
  for (const part of target.split('/')) {
    if (part === '..') { if (!parts.length) return null; parts.pop(); }
    else if (part && part !== '.') parts.push(part);
  }
  return parts.join('/');
}

const markdown = window.markdownit({ html: false, highlight: (code, language) =>
  /^(gherkin|feature)$/i.test(language) ? '<pre class="gherkin"><code>' + highlightGherkin(code) + '</code></pre>' : '' });
markdown.core.ruler.after('inline', 'task-checkboxes', state => {
  state.tokens.forEach((token, index) => {
    if (token.type !== 'inline' || state.tokens[index - 2]?.type !== 'list_item_open') return;
    const first = token.children[0];
    const match = first?.type === 'text' && first.content.match(/^\[([ xX])\]\s+/);
    if (!match) return;
    first.content = first.content.slice(match[0].length);
    const checkbox = new state.Token('html_inline', '', 0);
    checkbox.content = '<input type="checkbox" disabled' + (match[1].toLowerCase() === 'x' ? ' checked' : '') + '>';
    token.children.unshift(checkbox);
  });
});
const defaultLinkOpen = markdown.renderer.rules.link_open || ((tokens, index, options, env, renderer) => renderer.renderToken(tokens, index, options));
markdown.renderer.rules.link_open = (tokens, index, options, env, renderer) => {
  const token = tokens[index];
  const href = token.attrGet('href');
  const target = documentPath(href, env.basePath);
  if (target) {
    const section = env.sections.findIndex(s => s.kind !== 'notes' && s.path === target);
    token.attrSet('href', section >= 0 ? '#source-' + section : '/api/document?path=' + encodeURIComponent(target));
    if (section < 0) token.attrSet('target', '_blank');
  } else if (!href?.startsWith('#') && !/^(https?:|mailto:)/i.test(href || '')) {
    // Unsupported local files are displayed as links without issuing a file request.
    token.attrSet('href', '#');
  } else if (/^(https?:|mailto:)/i.test(href || '')) token.attrSet('target', '_blank');
  token.attrSet('rel', 'noopener noreferrer');
  return defaultLinkOpen(tokens, index, options, env, renderer);
};

function renderSections(sections) {
  if (!sections.length) return '<p class="preview-empty">這張卡片尚無補充內容。</p>';
  const labels = { notes: '卡片筆記', ticket: 'Ticket', document: '補充文件', feature: 'Feature 規格' };
  return sections.map((section, index) => {
    const title = section.kind === 'notes' ? labels.notes : labels[section.kind] + '：' + section.title;
    const source = section.path ? '<a class="source-path" target="_blank" rel="noopener noreferrer" href="/api/document?path=' +
      encodeURIComponent(section.path) + '">' + esc(section.path) + '</a>' : '<span class="source-path">' + esc(section.target) + '</span>';
    const note = section.note ? '<p class="preview-note">' + esc(section.note) + '</p>' : '';
    const content = section.error ? '<p class="preview-error">' + esc(section.error) + '</p>' : section.format === 'gherkin'
      ? '<pre class="gherkin">' + highlightGherkin(section.content) + '</pre>'
      : '<div class="markdown">' + markdown.render(section.content, { basePath: section.path, sections }) + '</div>';
    return '<section class="preview-section" id="source-' + index + '"><h2>' + esc(title) + '</h2>' + source + note + content + '</section>';
  }).join('');
}

const storyIdentity = story => JSON.stringify([story.title, story.primary?.kind, story.primary?.target, story.link]);

async function openCard(story, preserveScroll = false) {
  const request = ++previewRequest;
  const mapVersion = version;
  const drawer = document.getElementById('drawer');
  document.getElementById('d-title').textContent = story.title;
  const body = document.getElementById('d-body');
  const p = document.getElementById('d-path');
  const scrollTop = preserveScroll ? body.scrollTop : 0;
  opened = { line: story.line, version: mapVersion, identity: storyIdentity(story), previewVersion: story.previewVersion };
  drawer.classList.add('open');
  if (!preserveScroll) { body.textContent = '載入中…'; body.scrollTop = 0; }
  p.textContent = '';
  try {
    const r = await fetch('/api/card?line=' + story.line + '&version=' + encodeURIComponent(mapVersion));
    if (request !== previewRequest) return;
    if (!r.ok) {
      if (r.status === 409) { closeDrawer(); toast('卡片已變動，畫面已更新，請重新選取'); await refresh(); }
      else { body.textContent = '無法載入卡片內容（' + r.status + '）'; opened.previewVersion = null; }
      return;
    }
    const data = await r.json();
    if (request !== previewRequest) return;
    p.textContent = data.file + ':' + data.line;
    body.innerHTML = renderSections(data.sections);
    body.scrollTop = scrollTop;
    opened.previewVersion = data.previewVersion;
  } catch (e) {
    if (request === previewRequest) { body.textContent = String(e); opened.previewVersion = null; }
  }
}
function closeDrawer() { opened = null; previewRequest++; document.getElementById('drawer').classList.remove('open'); }

function syncDrawer(map) {
  if (!opened) return;
  const matches = map.activities.flatMap(a => a.steps.flatMap(s => s.stories)).filter(st => storyIdentity(st) === opened.identity);
  const story = opened.version === map.version ? matches.find(st => st.line === opened.line) : matches.length === 1 ? matches[0] : null;
  if (!story) return closeDrawer();
  if (opened.version !== map.version || opened.previewVersion !== story.previewVersion) openCard(story, true);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

/* ---------- drag & drop: a card dropped in a cell is written back to markdown ---------- */

// The card being dragged, as { line } — `line` is the story's line number in the
// markdown file, which is how the server identifies it.
let dragging = null;
const indicator = document.createElement('div');
indicator.className = 'drop-line';

// The card the pointer is currently above the top half of: the drop lands
// before it, or at the end of the cell when there is none.
function cardBefore(cell, y) {
  for (const c of cell.querySelectorAll('.card')) {
    const r = c.getBoundingClientRect();
    if (y < r.top + r.height / 2) return c;
  }
  return null;
}

function endDrag() {
  dragging = null;
  indicator.remove();
  document.body.classList.remove('dragging');
  for (const el of document.querySelectorAll('.card.dragging')) el.classList.remove('dragging');
  for (const el of document.querySelectorAll('.cell.drop')) el.classList.remove('drop');
}

function makeDraggable(card, story) {
  card.draggable = true;
  card.dataset.line = story.line;
  card.addEventListener('dragstart', e => {
    dragging = { line: story.line };
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', story.title);
    card.classList.add('dragging');
    document.body.classList.add('dragging');
  });
  card.addEventListener('dragend', endDrag);
}

function makeDropTarget(cell, stepIndex, release) {
  cell.addEventListener('dragover', e => {
    if (!dragging) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    cell.classList.add('drop');
    const before = cardBefore(cell, e.clientY);
    if (before) cell.insertBefore(indicator, before); else cell.appendChild(indicator);
  });
  cell.addEventListener('dragleave', e => {
    if (cell.contains(e.relatedTarget)) return; // still inside, just crossing a card
    cell.classList.remove('drop');
    if (indicator.parentNode === cell) indicator.remove();
  });
  cell.addEventListener('drop', e => {
    if (!dragging) return;
    e.preventDefault();
    const before = cardBefore(cell, e.clientY);
    const line = dragging.line;
    endDrag();
    moveCard({
      line,
      toStep: stepIndex,
      toRelease: release,
      beforeLine: before ? Number(before.dataset.line) : null,
    });
  });
}

/* ---------- click to preview, double-click to tick ---------- */

// A double-click also fires two clicks, so the preview is held back just long
// enough to see whether a second click is coming.
const DBLCLICK_MS = 220;
let clickTimer = null;

function bindClicks(card, story) {
  card.addEventListener('click', () => {
    if (!story.preview.available && !story.preview.missing) return;
    clearTimeout(clickTimer);
    clickTimer = setTimeout(() => openCard(story), DBLCLICK_MS);
  });
  card.addEventListener('dblclick', () => {
    clearTimeout(clickTimer);
    toggleDone(story);
  });
}

// Every card edit goes the same way: post it with the version we are looking
// at, and re-render from the map the server sends back.
async function postEdit(path, payload, what) {
  try {
    const r = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ version, ...payload }),
    });
    const data = await r.json();
    if (!r.ok) {
      toast(r.status === 409
        ? 'story map 已被其他人修改，畫面已更新——請再試一次'
        : (what + '失敗：' + (data.error || r.status)));
      if (r.status === 409) refresh();
      return;
    }
    render(data);
  } catch (e) {
    toast(what + '失敗：' + e);
  }
}

const moveCard = (payload) => postEdit('/api/move', payload, '移動');

// `done` is the state we want, not a toggle: if this request races with
// anything else the outcome is still what the user saw themselves ask for.
const toggleDone = (story) => postEdit('/api/done', { line: story.line, done: !story.done }, '勾選');

/* ---------- compact spots-route view ---------- */

function updateViewControls() {
  const compact = activeView === 'spots-route';
  document.body.dataset.view = activeView;
  document.getElementById('view-label').textContent = compact ? 'spots-route' : 'USM';
  document.getElementById('view-toggle').setAttribute('aria-pressed', String(compact));
  document.getElementById('view-toggle').setAttribute('aria-label', compact ? '切換至 USM 視圖' : '切換至 spots-route 圖');
  document.getElementById('interaction-hint').textContent = compact
    ? '點擊預覽 · 點兩下勾選完成' : '拖曳換 release／step · 點兩下勾選完成';
}

function toggleView() {
  if (dragging) return;
  clearTimeout(clickTimer);
  clickTimer = null;
  activeView = activeView === 'usm' ? 'spots-route' : 'usm';
  if (currentMap) render(currentMap); else updateViewControls();
}

document.getElementById('view-toggle').addEventListener('click', toggleView);
document.addEventListener('keydown', e => {
  if (e.key !== 'Tab' || e.shiftKey || e.ctrlKey || e.altKey || e.metaKey || e.repeat || e.defaultPrevented || dragging) return;
  // Preserve editing and keyboard navigation inside the preview drawer.
  if (e.target.closest('input, textarea, select, [contenteditable]:not([contenteditable="false"]), [role="textbox"], #drawer.open')) return;
  e.preventDefault();
  toggleView();
});

function featureNode(story) {
  const node = document.createElement('button');
  node.type = 'button';
  node.className = 'feature-node' + (story.done ? ' done' : '');
  node.dataset.line = story.line;
  const status = story.done ? '已完成' : '未完成';
  node.setAttribute('aria-label', story.title + '，' + status);
  node.title = story.title + '\n' + status + '\n點擊預覽 · 點兩下切換完成狀態';
  const dot = document.createElement('span');
  dot.className = 'feature-dot';
  dot.setAttribute('aria-hidden', 'true');
  const label = document.createElement('span');
  label.className = 'feature-label';
  label.textContent = story.title;
  node.appendChild(dot);
  node.appendChild(label);
  bindClicks(node, story);
  return node;
}

function routePath(from, to, width, returnY) {
  const start = from.x + from.radius + 3;
  const end = to.x - to.radius - 4;
  if (Math.abs(from.y - to.y) < 1) return `M ${start} ${from.y} H ${end}`;

  // Each release occupies one row. Return below its labels, then enter the
  // next release from the left, leaving room for that release's heading.
  const left = 3, right = width - 3, bend = 10;
  const middle = returnY;
  return `M ${start} ${from.y} H ${right - bend} Q ${right} ${from.y} ${right} ${from.y + bend}` +
    ` V ${middle - bend} Q ${right} ${middle} ${right - bend} ${middle}` +
    ` H ${left + bend} Q ${left} ${middle} ${left} ${middle + bend}` +
    ` V ${to.y - bend} Q ${left} ${to.y} ${left + bend} ${to.y} H ${end}`;
}

function bandTransition(from, to, minThickness = 6) {
  const source = [...from.map(segment => segment.left), from.at(-1).right];
  const target = [...to.map(segment => segment.left), to.at(-1).right];
  const current = [...source];
  const pending = source.map((x, boundary) => boundary).filter(boundary => Math.abs(source[boundary] - target[boundary]) > .01);
  const order = [];
  // Move one shared edge at a time, keeping both neighboring bands wide
  // enough. Outward moves free space for the remaining inward moves.
  while (pending.length) {
    const index = pending.findIndex(boundary =>
      (boundary === 0 || target[boundary] - current[boundary - 1] >= minThickness - .01) &&
      (boundary === current.length - 1 || current[boundary + 1] - target[boundary] >= minThickness - .01));
    if (index < 0) throw new Error('背景色帶寬度不足，無法安排連接段');
    const [boundary] = pending.splice(index, 1);
    current[boundary] = target[boundary];
    order.push(boundary);
  }
  return { source, target, order, minGap: (order.length + 1) * minThickness };
}

function bandEdgePath(transition, boundary, top, bottom, reverse = false) {
  const rank = transition.order.indexOf(boundary);
  if (rank < 0) return ` V ${reverse ? top : bottom}`;
  const y = top + (bottom - top) * (rank + 1) / (transition.order.length + 1);
  return reverse ? ` V ${y} H ${transition.source[boundary]} V ${top}`
    : ` V ${y} H ${transition.target[boundary]} V ${bottom}`;
}

function stepBandPath(segments, transitions, step) {
  const first = segments[0], last = segments.at(-1);
  let path = `M ${first.left} ${first.top} H ${first.right} V ${first.bottom}`;
  for (let i = 1; i < segments.length; i++) {
    const current = segments[i];
    path += bandEdgePath(transitions[i - 1], step + 1, segments[i - 1].bottom, current.top) + ` V ${current.bottom}`;
  }
  path += ` H ${last.left} V ${last.top}`;
  for (let i = segments.length - 2; i >= 0; i--) {
    const current = segments[i];
    path += bandEdgePath(transitions[i], step, current.bottom, segments[i + 1].top, true) + ` V ${current.top}`;
  }
  return path + ' Z';
}

function drawRoutes() {
  const routeMap = document.getElementById('board').querySelector('.route-map');
  if (!routeMap) return;
  const bounds = routeMap.getBoundingClientRect();
  if (!bounds.width) return;
  const rows = [...routeMap.querySelectorAll('.route-track')].map(track => {
    const trackBounds = track.getBoundingClientRect();
    return { width: trackBounds.right - bounds.left, returnY: trackBounds.bottom - bounds.top + 12,
      steps: [...track.querySelectorAll('.route-step')].map(step => {
        const rect = step.getBoundingClientRect();
        return { left: rect.left - bounds.left, right: rect.right - bounds.left,
          top: rect.top - bounds.top - 6, bottom: rect.bottom - bounds.top + 6 };
      }),
      points: [...track.querySelectorAll('.feature-dot')].map(dot => {
        const rect = dot.getBoundingClientRect();
        return { x: rect.left + rect.width / 2 - bounds.left, y: rect.top + rect.height / 2 - bounds.top, radius: rect.width / 2 };
      }) };
  });
  const transitions = rows.slice(1).map((row, index) => bandTransition(rows[index].steps, row.steps));
  const releases = routeMap.querySelectorAll('.route-release');
  let resized = false;
  transitions.forEach((transition, index) => {
    const gap = rows[index + 1].steps[0].top - rows[index].steps[0].bottom;
    if (gap < transition.minGap - .01) {
      const release = releases[index];
      const padding = parseFloat(release.style.paddingBottom) || 30;
      release.style.paddingBottom = (padding + transition.minGap - gap) + 'px';
      resized = true;
    }
  });
  if (resized) return drawRoutes();
  const bands = routeMap.querySelector('.route-bands');
  bands.setAttribute('viewBox', `0 0 ${bounds.width} ${bounds.height}`);
  bands.innerHTML = rows[0].steps.map((_, step) => '<path class="step-band' + (step % 2 ? ' alt' : '') +
    '" data-step="' + step + '" d="' + stepBandPath(rows.map(row => row.steps[step]), transitions, step) + '"/>').join('');
  const paths = [];
  rows.forEach((row, index) => {
    row.points.slice(1).forEach((point, i) => paths.push(routePath(row.points[i], point, row.width)));
    const next = rows[index + 1];
    if (next) paths.push(routePath(row.points.at(-1), next.points[0], row.width, row.returnY));
  });
  const svg = routeMap.querySelector('.route-arrows');
  svg.setAttribute('viewBox', `0 0 ${bounds.width} ${bounds.height}`);
  svg.innerHTML = '<defs><marker id="route-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">' +
    '<path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#adb5bd"/></marker></defs>' +
    paths.map(path => '<path class="route-link" d="' + path + '" marker-end="url(#route-arrow)"/>').join('');
}

function renderSpotsRoute(map, board) {
  const steps = map.activities.flatMap(a => a.steps.map(step => ({ activity: a.title, step })));
  const stories = steps.flatMap(s => s.step.stories);
  const releases = map.releases.map((title, index) => ({ title, index, stories: stories.filter(s => s.release === index) }));
  const backlog = releases.filter(r => r.title === 'Backlog').flatMap(r => r.stories);
  const routes = releases.filter(r => r.title !== 'Backlog' && r.stories.length);
  const layout = document.createElement('div');
  layout.className = 'spots-route';
  const spots = document.createElement('aside');
  spots.className = 'spots-area';
  spots.innerHTML = '<h2>spots<span>Backlog · ' + backlog.length + '</span></h2>';
  const spotsNodes = document.createElement('div');
  spotsNodes.className = 'spots-nodes';
  for (const story of backlog) spotsNodes.appendChild(featureNode(story));
  if (!backlog.length) spotsNodes.innerHTML = '<p class="spots-empty">Backlog 目前沒有卡片</p>';
  spots.appendChild(spotsNodes);
  layout.appendChild(spots);

  const route = document.createElement('section');
  route.className = 'route-area';
  route.innerHTML = '<h2>route<span>' + routes.reduce((count, r) => count + r.stories.length, 0) + ' features</span></h2>';
  const routeMap = document.createElement('div');
  routeMap.className = 'route-map';
  const bands = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  bands.setAttribute('class', 'route-bands');
  bands.setAttribute('aria-hidden', 'true');
  routeMap.appendChild(bands);
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'route-arrows');
  svg.setAttribute('aria-hidden', 'true');
  routeMap.appendChild(svg);
  for (const release of routes) {
    const section = document.createElement('section');
    section.className = 'route-release';
    const heading = document.createElement('h3');
    heading.textContent = release.title;
    section.appendChild(heading);
    const track = document.createElement('div');
    track.className = 'route-track';
    track.dataset.release = release.index;
    const nodes = document.createElement('div');
    nodes.className = 'route-nodes';
    steps.forEach(({ activity, step }, index) => {
      const group = document.createElement('div');
      group.className = 'route-step';
      group.dataset.step = index;
      group.title = [activity, step.title].filter(Boolean).join('／');
      for (const story of step.stories) if (story.release === release.index) group.appendChild(featureNode(story));
      nodes.appendChild(group);
    });
    track.appendChild(nodes);
    section.appendChild(track);
    routeMap.appendChild(section);
  }
  if (routes.length) route.appendChild(routeMap);
  else route.innerHTML += '<p class="route-empty">尚無排入 release 的卡片</p>';
  layout.appendChild(route);
  const scrollLeft = board.scrollLeft;
  board.innerHTML = '';
  board.appendChild(layout);
  board.scrollLeft = scrollLeft;
  drawRoutes();
  if (typeof ResizeObserver === 'function') {
    routeObserver = new ResizeObserver(drawRoutes);
    routeObserver.observe(route);
  }
}

function render(map) {
  if (map.version !== version) { clearTimeout(clickTimer); clickTimer = null; }
  currentMap = map;
  routeObserver?.disconnect();
  routeObserver = null;
  updateViewControls();
  version = map.version;
  viewVersion = map.viewVersion;
  if (!map.error) syncDrawer(map); else closeDrawer();
  document.getElementById('title').textContent = '⚾ ' + (map.title || 'Scorecard');
  document.getElementById('file').textContent = map.file || '';
  document.title = '⚾ ' + (map.title || 'Scorecard');
  const board = document.getElementById('board');
  document.getElementById('warnings').textContent = (map.warnings || []).join('  ·  ');

  if (map.error) { board.innerHTML = '<div id="empty">' + esc(map.error) + '</div>'; return; }
  if (activeView === 'spots-route') { renderSpotsRoute(map, board); return; }

  const steps = [];
  for (const a of map.activities) for (const s of a.steps) steps.push({ activity: a, step: s });
  if (!steps.length) {
    board.innerHTML = '<div id="empty">這張 story map 是空的 — 在 ' + esc(map.file) +
      ' 中用 ## Activity / ### Step / - [ ] [[feature]] 開始</div>';
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'grid';
  grid.style.gridTemplateColumns = 'minmax(60px,auto) repeat(' + steps.length + ', minmax(150px, 1fr))';

  const put = (el, col, row, span) => {
    el.style.gridColumn = span ? col + ' / span ' + span : String(col);
    el.style.gridRow = String(row);
    grid.appendChild(el);
  };

  // row 1: activities (spanning), row 2: steps
  let col = 2;
  for (const a of map.activities) {
    if (!a.steps.length) continue;
    const el = document.createElement('div');
    el.className = 'activity';
    el.textContent = a.title;
    put(el, col, 1, a.steps.length);
    col += a.steps.length;
  }
  steps.forEach((s, i) => {
    // 沒有 ### 的 activity：step 卡從缺，卡片直接接在 ## 那一欄下面
    if (s.step.title === null) return;
    const el = document.createElement('div');
    el.className = 'step';
    el.textContent = s.step.title;
    put(el, i + 2, 2);
  });

  // release lanes
  const releases = map.releases.length ? map.releases : ['MVP'];
  releases.forEach((rel, ri) => {
    // Each lane is closed by the line below it — that line is what the release
    // name labels, mirroring the `<!-- ---- {name} -->` separator in markdown.
    const rowCells = 3 + ri * 2;
    const rowSep = rowCells + 1;
    const sep = document.createElement('div');
    sep.className = 'lane-sep';
    sep.style.gridRow = String(rowSep);
    grid.appendChild(sep);

    const label = document.createElement('div');
    label.className = 'lane-label';
    label.textContent = rel;
    put(label, 1, rowCells);

    steps.forEach((s, i) => {
      const cell = document.createElement('div');
      cell.className = 'cell';
      makeDropTarget(cell, i, rel);
      for (const st of s.step.stories) {
        if (st.release !== ri) continue;
        const card = document.createElement('div');
        const hasPreview = st.preview.available || st.preview.missing;
        const missing = !st.preview.available && st.preview.missing;
        const sources = [st.preview.notes ? '筆記' : '', st.preview.tickets ? st.preview.tickets + ' tickets' : '',
          st.preview.documents ? st.preview.documents + ' 文件' : '', st.preview.features ? '規格' : '',
          st.preview.missing ? st.preview.missing + ' 來源待補' : ''].filter(Boolean).join(' · ');
        card.className = 'card' + (st.done ? ' done' : '') +
          (hasPreview ? ' linked' : '') + (missing ? ' missing' : '');
        card.innerHTML = '<span class="t">' + esc(st.title) + '</span>' +
          '<span class="mark">' + (st.done ? '✅' : missing ? '📄?' : hasPreview ? '🔗' : '') + '</span>' +
          (sources ? '<span class="sources">' + esc(sources) + '</span>' : '');
        card.title = st.title + (hasPreview ? '\n點擊預覽：' + sources : '') +
          '\n點兩下標記' + (st.done ? '未完成' : '完成') + '，拖曳可移到其他 release / step';
        bindClicks(card, st);
        makeDraggable(card, st);
        cell.appendChild(card);
      }
      put(cell, i + 2, rowCells);
    });
  });

  board.innerHTML = '';
  board.appendChild(grid);
}

async function refresh() {
  const r = await fetch('/api/map');
  const map = await r.json();
  render(map);
}

async function poll() {
  // Re-rendering mid-drag would rip the dragged card out from under the pointer.
  if (!dragging) {
    try {
      const r = await fetch('/api/map');
      const map = await r.json();
      if (map.viewVersion !== viewVersion) {
        render(map);
      } else if (opened && opened.previewVersion === null) {
        syncDrawer(map);
      }
    } catch (e) { /* server restarting; keep polling */ }
  }
  setTimeout(poll, 1500);
}
poll();
